name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is where it runs in production (an Ubuntu server); Windows is the dev machine.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc skips install scripts, so no compiler is needed for better-sqlite3.
      - run: npm ci

      # tsc is configured with noEmitOnError: a type error fails the build.
      - run: npm run build

      - run: npm test

      - name: CLI smoke test
        run: node dist/cli.js doctor
