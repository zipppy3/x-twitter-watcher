services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: always
    # Only the two values the server needs are passed in (read from .env by
    # compose), so Twitter tokens and proxy credentials stay out of the container.
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:9201:8081"

volumes:
  telegram-bot-api-data:
